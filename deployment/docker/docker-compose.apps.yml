# Docker Compose stack for the two applications built in this release —
# apps/backend (Platform Backend Host / REST API) and apps/erp-web (ERP Web) —
# plus the Postgres database the backend needs. Reuses the existing
# parameterized Dockerfile.backend / Dockerfile.frontend (see
# deployment/docker/images.json for the pattern used by the rest of the
# platform's services/apps) rather than introducing new Dockerfiles.
#
# Usage:
#   docker compose -f deployment/docker/docker-compose.apps.yml up --build
#
# This does not replace infrastructure/docker/docker-compose.yml (the
# shared platform infra stack: redis, nats, minio, qdrant, observability).
# For a full local environment, run both stacks together.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lateen
      POSTGRES_PASSWORD: lateen
      POSTGRES_DB: lateen_os_backend
    ports:
      - '5432:5432'
    volumes:
      - lateen-backend-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lateen -d lateen_os_backend']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
      args:
        SERVICE_PACKAGE: '@lateen-os/backend'
        SERVICE_PATH: apps/backend
        SERVICE_PORT: '4013'
    ports:
      - '4013:4013'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lateen:lateen@postgres:5432/lateen_os_backend
      # Overridden below with real secrets in any non-local deployment — see
      # apps/backend/.env.example. The backend refuses to start with these
      # dev-default values when NODE_ENV=production (see
      # src/config/index.ts's assertProductionSafe), so these placeholders
      # exist only to document the required shape; export real values via a
      # `.env` file or your orchestrator's secret store before deploying.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a production JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a production JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3013}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4013/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  erp-web:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        APP_PACKAGE: '@lateen-os/erp-web'
        APP_PATH: apps/erp-web
        APP_PORT: '3013'
    ports:
      - '3013:3013'
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:4013
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3013/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  lateen-backend-postgres-data:

networks:
  default:
    name: lateen-os-apps
