# Docker Compose stack for the two applications built in this release:
# apps/backend (Platform Backend Host / REST API)
# apps/erp-web (ERP Web)
# plus the Postgres database the backend needs.
#
# Local/development usage:
#   docker compose -f deployment/docker/docker-compose.apps.yml up --build
#
# Production notes:
# - PostgreSQL is not published to the host.
# - Backend is bound to localhost only.
# - ERP Web is bound to localhost only.
# - External access is provided through Cloudflare Tunnel.
#
# This does not replace infrastructure/docker/docker-compose.yml
# (the shared platform infrastructure stack: redis, nats, minio,
# qdrant, observability).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lateen
      POSTGRES_PASSWORD: lateen
      POSTGRES_DB: lateen_os_backend
    volumes:
      - lateen-backend-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lateen -d lateen_os_backend']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
      args:
        SERVICE_PACKAGE: '@lateen-os/backend'
        SERVICE_PATH: apps/backend
        SERVICE_PORT: '4013'
    ports:
      - '127.0.0.1:4013:4013'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lateen:lateen@postgres:5432/lateen_os_backend

      # Production secrets must be supplied through the environment.
      # The backend refuses to start with development-default values.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a production JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a production JWT_REFRESH_SECRET}

      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.lateenos.sa}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4013/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  erp-web:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        APP_PACKAGE: '@lateen-os/erp-web'
        APP_PATH: apps/erp-web
        APP_PORT: '3013'
    ports:
      - '127.0.0.1:3013:3013'
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:4013

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3013/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  lateen-backend-postgres-data:

networks:
  default:
    name: lateen-os-apps
