apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lateen-letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@lateen.io
    privateKeySecretRef:
      name: lateen-letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lateen-tls
  namespace: lateen-os
spec:
  secretName: lateen-tls
  issuerRef:
    name: lateen-letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - app.lateen.io
    - staging.lateen.io
