# Default values — override with values-dev/staging/prod.yaml

global:
  environment: development
  imageRegistry: ghcr.io/lateen-os
  imageTag: latest
  imagePullPolicy: IfNotPresent
  organizationId: "00000000-0000-4000-8000-000000000001"
  timezone: Asia/Riyadh
  tls:
    enabled: false
    secretName: lateen-tls
  ingress:
    enabled: true
    className: nginx
    host: lateen.local
  observability:
    otlpEndpoint: http://otel-collector:4318
    logFormat: json
  podSecurity:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001

secrets:
  externalSecrets:
    enabled: false
    secretStoreRef: vault-backend
  vault:
    enabled: false
    path: secret/lateen-os
  # Dev-only placeholders — override via External Secrets in staging/prod
  postgresPassword: lateen_dev_postgres
  redisPassword: lateen_dev_redis
  minioSecretKey: lateen_dev_minio
  jwtSecret: lateen_dev_jwt_change_in_production
  grafanaAdminPassword: lateen_dev_grafana

postgresql:
  enabled: true
  image: postgres:16-alpine
  storage: 20Gi
  databases:
    - lateen_os
    - lateen_identity
    - lateen_integration
    - lateen_mission_scheduler

redis:
  enabled: true
  image: redis:7-alpine

nats:
  enabled: true
  image: nats:2.10-alpine

minio:
  enabled: true
  image: minio/minio:RELEASE.2024-12-18T13-15-44Z

qdrant:
  enabled: true
  image: qdrant/qdrant:v1.12.5

prometheus:
  enabled: true
  image: prom/prometheus:v2.55.1

grafana:
  enabled: true
  image: grafana/grafana:11.4.0
  servicePort: 3000

otelCollector:
  enabled: true
  image: otel/opentelemetry-collector-contrib:0.116.1

backends:
  business-dna-service:
    enabled: true
    port: 4001
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    database: lateen_os
    redisDb: 0
  product-discovery:
    enabled: true
    port: 4002
    replicas: 1
    database: lateen_os
    redisDb: 0
  identity-service:
    enabled: true
    port: 4003
    replicas: 2
    database: lateen_identity
    redisDb: 1
  integration-hub:
    enabled: true
    port: 4004
    replicas: 1
    database: lateen_integration
    redisDb: 2
  mission-scheduler:
    enabled: true
    port: 4005
    replicas: 1
    database: lateen_mission_scheduler
    redisDb: 3

frontends:
  ai-product-manager:
    enabled: true
    port: 3000
    replicas: 1
    path: /
  business-dna-studio:
    enabled: true
    port: 3001
    replicas: 1
    path: /studio
  ceo-cockpit:
    enabled: true
    port: 3002
    replicas: 1
    path: /cockpit
  customer-portal:
    enabled: true
    port: 3003
    replicas: 2
    path: /portal
  lateen-assistant:
    enabled: true
    port: 3004
    replicas: 2
    path: /assistant

monitoring:
  slo:
    availabilityTarget: 99.5
    latencyP99Ms: 2000
    latencyP99Seconds: 2
  alerts:
    enabled: true

backups:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 14

networkPolicy:
  enabled: true

rateLimit:
  enabled: true
  requestsPerSecond: 100
