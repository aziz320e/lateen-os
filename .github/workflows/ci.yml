name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Dependency & security audit
        # Informational, not gating: this monorepo carries pre-existing
        # transitive vulnerabilities across packages outside this change's
        # scope (see release/KNOWN_LIMITATIONS.md). Failing the build on
        # every pnpm advisory update would make CI red for reasons unrelated
        # to the code being merged. Findings are still visible in the log
        # for triage, and deploy.yml runs CodeQL + Trivy + SBOM generation
        # as the gating security scan before any deployment.
        run: pnpm audit || true

      - name: Documentation validation
        run: |
          required_docs=(
            "README.md"
            "CLAUDE.md"
            "release/VERSION"
            "release/CHANGELOG.md"
            "release/RELEASE_NOTES.md"
            "apps/backend/.env.example"
          )
          missing=0
          for doc in "${required_docs[@]}"; do
            if [ ! -f "$doc" ]; then
              echo "::error::Missing required doc: $doc"
              missing=1
            fi
          done
          exit $missing

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/backend/dist
            apps/erp-web/.next
          retention-days: 7
          if-no-files-found: warn
